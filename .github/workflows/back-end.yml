name: Compile Backend

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'back-end/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'back-end/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./back-end
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: back-end/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Compile TypeScript
      run: npx tsc --noEmit

    - name: Run tests
      run: npm test
    
    - name: Run linter (Biome)
      run: npx biome check .
